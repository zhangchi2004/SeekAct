[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youyi-sen-camera-motion"
version = "0.1.0"
description = "Kitchen-focused camera-first motion mining for egocentric video"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "Pillow>=10",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
